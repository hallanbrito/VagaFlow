name: API CI

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - '.github/workflows/api-ci.yml'
      - 'scripts/smoke-api.sh'
      - 'infra/**'
      - '.config/dotnet-tools.json'
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - '.github/workflows/api-ci.yml'
      - 'scripts/smoke-api.sh'

permissions:
  contents: read

jobs:
  api-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vagaflow
          POSTGRES_USER: vagaflow
          POSTGRES_PASSWORD: ci_ephemeral_local_only
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U vagaflow -d vagaflow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      VAGAFLOW_TEST_DB_CONNECTION: Host=127.0.0.1;Port=55432;Database=vagaflow;Username=vagaflow;Password=ci_ephemeral_local_only
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore tests
        run: dotnet restore apps/api/tests/VagaFlow.Api.Tests/VagaFlow.Api.Tests.csproj
      - name: Build tests
        run: dotnet build apps/api/tests/VagaFlow.Api.Tests/VagaFlow.Api.Tests.csproj --no-restore --configuration Release
      - name: Run tests
        run: dotnet test apps/api/tests/VagaFlow.Api.Tests/VagaFlow.Api.Tests.csproj --no-build --configuration Release --verbosity normal
